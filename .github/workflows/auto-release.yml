name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Полная история для тегов
        
    - name: Check if version changed
      id: check
      run: |
        # Получаем текущую версию
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        echo "Current version: $CURRENT_VERSION"
        
        # Проверяем, существует ли уже тег
        TAG="v$CURRENT_VERSION"
        git fetch --tags
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, skipping release"
          echo "should_release=false" >> $GITHUB_OUTPUT
        else
          echo "New version detected: $CURRENT_VERSION"
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        fi
        
    - name: Setup Node.js
      if: steps.check.outputs.should_release == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
        
    - name: Install Dependencies
      if: steps.check.outputs.should_release == 'true'
      run: npm ci
      
    - name: Lint
      if: steps.check.outputs.should_release == 'true'
      run: npm run lint
      
    - name: Build
      if: steps.check.outputs.should_release == 'true'
      run: npm run build
      
    - name: Test
      if: steps.check.outputs.should_release == 'true'
      run: npm test
      
    - name: Create and Push Tag
      if: steps.check.outputs.should_release == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ steps.check.outputs.tag }}" -m "Release ${{ steps.check.outputs.tag }}"
        git push origin "${{ steps.check.outputs.tag }}"
        
    - name: Create GitHub Release
      if: steps.check.outputs.should_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.check.outputs.tag }}
        name: Release ${{ steps.check.outputs.tag }}
        generate_release_notes: true
        draft: false
        prerelease: false
        
    - name: Publish to npm
      if: steps.check.outputs.should_release == 'true'
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        
    - name: Summary
      if: steps.check.outputs.should_release == 'true'
      run: |
        echo "## 🎉 Release ${{ steps.check.outputs.tag }} Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** ${{ steps.check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **npm:** https://www.npmjs.com/package/@mazix/n8n-nodes-converter-documents" >> $GITHUB_STEP_SUMMARY
        echo "- **GitHub:** https://github.com/mazixs/n8n-node-converter-documents/releases/tag/${{ steps.check.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
        
    - name: Skip Summary
      if: steps.check.outputs.should_release != 'true'
      run: |
        echo "## ⏭️ Release Skipped" >> $GITHUB_STEP_SUMMARY
        echo "Tag already exists for current version" >> $GITHUB_STEP_SUMMARY
